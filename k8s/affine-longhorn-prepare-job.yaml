apiVersion: batch/v1
kind: Job
metadata:
  name: affine-longhorn-prepare
  namespace: affine
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeName: main-server
      containers:
        - name: prepare
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eux
              df -h /new-config /new-storage
              echo ok > /new-config/.longhorn-prepare
              echo ok > /new-storage/.longhorn-prepare
              sync
              rm -f /new-config/.longhorn-prepare /new-storage/.longhorn-prepare
              sync
              echo "affine-longhorn-prepare-ok"
          volumeMounts:
            - name: new-config
              mountPath: /new-config
            - name: new-storage
              mountPath: /new-storage
      volumes:
        - name: new-config
          persistentVolumeClaim:
            claimName: affine-config-pvc-longhorn
        - name: new-storage
          persistentVolumeClaim:
            claimName: affine-storage-longhorn
