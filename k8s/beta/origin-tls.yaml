apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lightnyai-beta-origin
  namespace: gpt
spec:
  secretName: lightnyai-beta-origin-tls
  duration: 2160h
  renewBefore: 720h
  dnsNames:
    - lightnyai-beta.internal
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: lightnyai-origin-ca
    kind: Issuer
