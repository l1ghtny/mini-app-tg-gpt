apiVersion: v1
kind: ConfigMap
metadata:
  name: teamcity-docker-daemon-config
  namespace: gamedev
  labels:
    app: teamcity-agent-extra
data:
  daemon.json: |
    {
      "builder": {
        "gc": {
          "enabled": true,
          "defaultKeepStorage": "20GB"
        }
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teamcity-agent-k8s-node-2-state-pvc
  namespace: gamedev
  labels:
    app: teamcity-agent-extra
    teamcity-agent: gamedev-teamcity-agent-k8s-node-2
    storage-role: durable-state
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-r2-local
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teamcity-agent-k8s-node-2-cache-pvc
  namespace: gamedev
  labels:
    app: teamcity-agent-extra
    teamcity-agent: gamedev-teamcity-agent-k8s-node-2
    storage-role: disposable-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ci-cache
  resources:
    requests:
      storage: 80Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teamcity-agent-k8s-node-2
  namespace: gamedev
  labels:
    app: teamcity-agent-extra
    teamcity-agent: gamedev-teamcity-agent-k8s-node-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teamcity-agent-extra
      teamcity-agent: gamedev-teamcity-agent-k8s-node-2
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: teamcity-agent-extra
        teamcity-agent: gamedev-teamcity-agent-k8s-node-2
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node-2
      securityContext:
        runAsUser: 0
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: prepare-agent-data
          image: jetbrains/teamcity-agent:latest-linux-sudo
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - mkdir -p /agent-state/conf /agent-cache/work /agent-cache/temp /agent-cache/tools /agent-cache/plugins /agent-cache/system /agent-cache/logs /agent-cache/docker
          volumeMounts:
            - mountPath: /agent-state
              name: agent-state
            - mountPath: /agent-cache
              name: agent-cache
      containers:
        - name: teamcity-agent
          image: jetbrains/teamcity-agent:latest-linux-sudo
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_URL
              value: http://teamcity-server-service.gamedev:8111/
            - name: AGENT_NAME
              value: gamedev-teamcity-agent-k8s-node-2
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              ephemeral-storage: 2Gi
          volumeMounts:
            - mountPath: /data/teamcity_agent/conf
              name: agent-state
              subPath: conf
            - mountPath: /opt/buildagent/work
              name: agent-cache
              subPath: work
            - mountPath: /opt/buildagent/temp
              name: agent-cache
              subPath: temp
            - mountPath: /opt/buildagent/tools
              name: agent-cache
              subPath: tools
            - mountPath: /opt/buildagent/plugins
              name: agent-cache
              subPath: plugins
            - mountPath: /opt/buildagent/system
              name: agent-cache
              subPath: system
            - mountPath: /opt/buildagent/logs
              name: agent-cache
              subPath: logs
        - name: docker-dind
          image: docker:29-dind
          imagePullPolicy: IfNotPresent
          args:
            - --host=tcp://0.0.0.0:2375
            - --host=unix:///var/run/docker.sock
            - --insecure-registry=registry.container-registry.svc.cluster.local:5000
            - --insecure-registry=10.152.183.21:5000
            - --insecure-registry=localhost:32000
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 512Mi
            limits:
              ephemeral-storage: 2Gi
          readinessProbe:
            exec:
              command:
                - docker
                - info
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - mountPath: /var/lib/docker
              name: agent-cache
              subPath: docker
            - mountPath: /etc/docker/daemon.json
              name: docker-daemon-config
              subPath: daemon.json
              readOnly: true
        - name: docker-gc
          image: docker:29-cli
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              until docker info >/dev/null 2>&1; do sleep 5; done
              while true; do
                docker image prune -af --filter "until=168h" || true
                docker builder prune -af --max-used-space 20GB || true
                sleep 21600
              done
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
      volumes:
        - name: agent-state
          persistentVolumeClaim:
            claimName: teamcity-agent-k8s-node-2-state-pvc
        - name: agent-cache
          persistentVolumeClaim:
            claimName: teamcity-agent-k8s-node-2-cache-pvc
        - name: docker-daemon-config
          configMap:
            name: teamcity-docker-daemon-config
---
