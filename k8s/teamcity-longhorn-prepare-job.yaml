apiVersion: batch/v1
kind: Job
metadata:
  name: teamcity-longhorn-prepare
  namespace: gamedev
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeName: main-server
      containers:
        - name: prepare
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eux
              df -h /new-data /new-logs
              echo ok > /new-data/.longhorn-prepare
              echo ok > /new-logs/.longhorn-prepare
              sync
              rm -f /new-data/.longhorn-prepare /new-logs/.longhorn-prepare
              sync
              echo "teamcity-longhorn-prepare-ok"
          volumeMounts:
            - name: new-data
              mountPath: /new-data
            - name: new-logs
              mountPath: /new-logs
      volumes:
        - name: new-data
          persistentVolumeClaim:
            claimName: teamcity-data-pvc-longhorn
        - name: new-logs
          persistentVolumeClaim:
            claimName: teamcity-logs-pvc-longhorn
