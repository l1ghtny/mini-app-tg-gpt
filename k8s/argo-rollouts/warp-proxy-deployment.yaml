apiVersion: apps/v1
kind: Deployment
metadata:
  name: warp-proxy
  namespace: gpt
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: warp-proxy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: warp-proxy
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: warp-proxy
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - main-server
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: workload.cybercolors.dev/high-memory
                operator: In
                values:
                - "true"
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: warp-proxy
              topologyKey: kubernetes.io/hostname
      securityContext:
        sysctls:
        - name: net.ipv6.conf.all.disable_ipv6
          value: "0"
        - name: net.ipv4.conf.all.src_valid_mark
          value: "1"
      containers:
      - name: warp
        image: caomingjun/warp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 1080
          protocol: TCP
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - >-
              curl --silent --show-error --location
              --connect-timeout 3 --max-time 5
              --socks5-hostname 127.0.0.1:1080
              https://tg-bot-images.lightny.pro/
              --output /dev/null
          periodSeconds: 5
          timeoutSeconds: 7
          failureThreshold: 24
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - >-
              curl --silent --show-error --location
              --connect-timeout 3 --max-time 5
              --socks5-hostname 127.0.0.1:1080
              https://tg-bot-images.lightny.pro/
              --output /dev/null
          periodSeconds: 10
          timeoutSeconds: 7
          failureThreshold: 2
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - >-
              curl --silent --show-error --location
              --connect-timeout 3 --max-time 5
              --socks5-hostname 127.0.0.1:1080
              https://tg-bot-images.lightny.pro/
              --output /dev/null
          periodSeconds: 30
          timeoutSeconds: 7
          failureThreshold: 3
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
