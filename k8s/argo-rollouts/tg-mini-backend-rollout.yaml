apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: tg-mini-backend-readiness
  namespace: gpt
  annotations:
    argocd.argoproj.io/tracking-id: tg-mini-backend-rollouts:argoproj.io/AnalysisTemplate:gpt/tg-mini-backend-readiness
spec:
  metrics:
    - name: candidate-readiness
      count: 5
      interval: 5s
      failureLimit: 2
      successCondition: result.status == "ready"
      provider:
        web:
          url: http://tg-mini-backend-canary.gpt.svc.cluster.local/health/ready
          timeoutSeconds: 4
---
apiVersion: v1
kind: Service
metadata:
  name: tg-mini-backend-canary
  namespace: gpt
  annotations:
    argocd.argoproj.io/tracking-id: tg-mini-backend-rollouts:/Service:gpt/tg-mini-backend-canary
spec:
  type: ClusterIP
  selector:
    app: tg-mini-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: tg-mini-backend
  namespace: gpt
  annotations:
    argocd.argoproj.io/tracking-id: tg-mini-backend-rollouts:argoproj.io/Rollout:gpt/tg-mini-backend
spec:
  replicas: 2
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 900
  progressDeadlineAbort: true
  selector:
    matchLabels:
      app: tg-mini-backend
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tg-mini-backend
    scaleDown: progressively
  strategy:
    canary:
      maxSurge: 25%
      maxUnavailable: 0
      minPodsPerReplicaSet: 1
      stableService: backend
      canaryService: tg-mini-backend-canary
      trafficRouting:
        nginx:
          stableIngress: tg-mini-backend
      steps:
        - setCanaryScale:
            replicas: 1
        - setWeight: 0
        - analysis:
            templates:
              - templateName: tg-mini-backend-readiness
        - setWeight: 20
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: tg-mini-backend-readiness
        - setWeight: 100
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: tg-mini-backend-readiness
