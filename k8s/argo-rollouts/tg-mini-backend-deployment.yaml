apiVersion: apps/v1
kind: Deployment
metadata:
  name: tg-mini-backend
  namespace: gpt
spec:
  replicas: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: tg-mini-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: tg-mini-backend
    spec:
      hostAliases:
      - ip: 10.77.0.2
        hostnames:
        - securepay.tinkoff.ru
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: tg-mini-backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: tg-mini-backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: api
        image: localhost:32000/tg-mini-app-backend:269
        imagePullPolicy: Always
        env:
        - name: WEB_AUTH_ADDITIONAL_ORIGINS
          value: "https://app.lightny.ru,https://app.lightnyai.ru"
        - name: PASSKEY_ALLOWED_ORIGINS
          value: "https://app.lightny.ru,https://app.lightnyai.ru"
        - name: CORS_ALLOWED_ORIGINS
          value: "http://localhost:5172,http://127.0.0.1:5172,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:4175,http://127.0.0.1:4175,http://192.168.1.137:5173,http://192.168.1.137:4173,https://gpt-mini-app.lightny.pro,https://gpt-mini-app-ru.lightny.pro,https://gpt-mini-app-dev.lightny.pro,https://preview--chat-bot-telegram.lovable.app,https://lightny.ru,https://www.lightny.ru,https://app.lightny.ru,https://app.lightnyai.ru"
        - name: WEB_AUTH_TRUSTED_PROXY_CIDRS
          value: "10.1.0.0/16,10.77.0.2/32,10.78.0.2/32,10.78.0.6/32"
        - name: HTTPS_PROXY
          value: socks5://warp-proxy:1080
        - name: HTTP_PROXY
          value: socks5://warp-proxy:1080
        - name: PROMETHEUS_METRICS_PORT
          value: "9100"
        envFrom:
        - secretRef:
            name: backend-env
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9100
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
            httpHeaders:
            - name: Host
              value: 127.0.0.1
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
            httpHeaders:
            - name: Host
              value: 127.0.0.1
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/live
            port: 8000
            httpHeaders:
            - name: Host
              value: 127.0.0.1
          periodSeconds: 5
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 30
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
