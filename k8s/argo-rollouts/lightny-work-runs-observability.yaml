apiVersion: v1
kind: Service
metadata:
  name: tg-mini-backend-metrics
  namespace: gpt
  labels:
    monitoring.lightny.io/scrape: "true"
spec:
  selector:
    app: tg-mini-backend
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: tg-mini-beta-backend-metrics
  namespace: gpt
  labels:
    monitoring.lightny.io/scrape: "true"
spec:
  selector:
    app: tg-mini-beta-backend
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: tg-mini-beta-work-run-worker-metrics
  namespace: gpt
  labels:
    monitoring.lightny.io/scrape: "true"
spec:
  selector:
    app: tg-mini-beta-work-run-worker
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lightny-application-metrics
  namespace: gpt
  labels:
    release: kube-prom-stack
spec:
  namespaceSelector:
    matchNames:
      - gpt
  selector:
    matchLabels:
      monitoring.lightny.io/scrape: "true"
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tg-mini-beta-prometheus
  namespace: gpt
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - tg-mini-beta-backend
          - tg-mini-beta-work-run-worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lightny-work-runs-grafana-dashboard
  namespace: gpt
  labels:
    grafana_dashboard: "1"
data:
  lightny-work-runs.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}},
          "targets": [{"expr": "sum by (event_type) (increase(lightny_work_run_lifecycle_total{service=~\"tg-mini-beta-.*-metrics\",event_type=~\"work.done|work.error|work.cancelled\"}[$__rate_interval]))", "legendFormat": "{{event_type}}", "refId": "A"}],
          "title": "Terminal outcomes",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"min": 0, "max": 1, "unit": "percentunit"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"expr": "sum(increase(lightny_work_run_lifecycle_total{service=~\"tg-mini-beta-.*-metrics\",event_type=\"work.done\"}[$__range])) / clamp_min(sum(increase(lightny_work_run_lifecycle_total{service=~\"tg-mini-beta-.*-metrics\",event_type=~\"work.done|work.error|work.cancelled\"}[$__range])), 1)", "refId": "A"}],
          "title": "Success rate",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8},
          "id": 3,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(lightny_work_run_queue_duration_seconds_bucket{service=~\"tg-mini-beta-.*-metrics\"}[$__rate_interval])))", "legendFormat": "p95 queue", "refId": "A"}],
          "title": "p95 queue duration",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8},
          "id": 4,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(lightny_work_run_execution_duration_seconds_bucket{service=~\"tg-mini-beta-.*-metrics\"}[$__rate_interval])))", "legendFormat": "p95 execution", "refId": "A"}],
          "title": "p95 execution duration",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8},
          "id": 5,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(lightny_work_run_total_duration_seconds_bucket{service=~\"tg-mini-beta-.*-metrics\"}[$__rate_interval])))", "legendFormat": "p95 total", "refId": "A"}],
          "title": "p95 total duration",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "currencyUSD"}, "overrides": []},
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 16},
          "id": 6,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"expr": "sum(increase(lightny_work_run_cost_usd_total{service=~\"tg-mini-beta-.*-metrics\"}[$__range]))", "refId": "A"}],
          "title": "Provider cost in range",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 16},
          "id": 7,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"expr": "sum(increase(lightny_work_run_retries_total{service=~\"tg-mini-beta-.*-metrics\"}[$__range]))", "refId": "A"}],
          "title": "Retries in range",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 16},
          "id": 8,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"expr": "sum(increase(lightny_work_artifact_download_urls_created_total{service=~\"tg-mini-beta-.*-metrics\"}[$__range]))", "refId": "A"}],
          "title": "Artifact download URLs",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}], "min": 0, "max": 1}, "overrides": []},
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 16},
          "id": 9,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [{"expr": "min by (service) (up{service=~\"tg-mini-beta-.*-metrics\"})", "legendFormat": "{{service}}", "refId": "A"}],
          "title": "Metrics targets",
          "type": "stat"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": ["lightny", "work-runs", "beta"],
      "templating": {"list": []},
      "time": {"from": "now-24h", "to": "now"},
      "timezone": "browser",
      "title": "Lightny Work - Beta Operations",
      "uid": "lightny-work-beta",
      "version": 1
    }
