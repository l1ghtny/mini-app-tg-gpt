apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-smoke-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-r2
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-smoke
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -eu
          echo "longhorn-ok" > /data/probe.txt
          cat /data/probe.txt
          df -h /data
          sleep 30
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: longhorn-smoke-pvc
