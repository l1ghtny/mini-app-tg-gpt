jobs:
  build_backend:
    name: 1. Build Beta Backend Image
    runs-on: self-hosted
    steps:
      - type: script
        name: Docker build and push beta backend
        script-content: |-
          #!/bin/bash
          set -euo pipefail

          cd backend
          if [ -n "${DOCKER_HOST:-}" ]; then
            PUSH_REGISTRY="registry.container-registry.svc.cluster.local:5000"
          else
            PUSH_REGISTRY="localhost:32000"
          fi
          IMAGE="$PUSH_REGISTRY/tg-mini-app-backend"
          TAG="beta-%build.number%"
          docker build --provenance=false -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
    repositories:
      - main:
          path: backend
          enabled: true

  build_frontend:
    name: 2. Build Beta Frontend Image
    runs-on: self-hosted
    steps:
      - type: script
        name: Docker build and push beta frontend
        script-content: |-
          #!/bin/bash
          set -euo pipefail

          cd frontend
          if [ -n "${DOCKER_HOST:-}" ]; then
            PUSH_REGISTRY="registry.container-registry.svc.cluster.local:5000"
          else
            PUSH_REGISTRY="localhost:32000"
          fi
          IMAGE="$PUSH_REGISTRY/tg-mini-frontend-new"
          TAG="beta-%build.number%"
          docker build --provenance=false \
            --build-arg VITE_API_URL="https://beta.app.lightny.ru" \
            --build-arg VITE_WEB_AUTH_ENABLED="true" \
            --build-arg VITE_TELEGRAM_OIDC_ENABLED="false" \
            --build-arg VITE_EMAIL_AUTH_ENABLED="false" \
            --build-arg VITE_WEB_APP_URL="https://beta.app.lightny.ru" \
            --build-arg VITE_PUBLIC_SITE_URL="https://lightny.ru" \
            --build-arg VITE_SUPPORT_EMAIL="support@lightny.pro" \
            --build-arg VITE_SENTRY_DSN="https://1ac498f4dab1ac99e6559131b50b9c74@o4510481798004736.ingest.de.sentry.io/4510481918132304" \
            --build-arg VITE_SENTRY_ENVIRONMENT="beta_prod_data" \
            --build-arg VITE_STARTER_BUNDLE_NAME="Welcoming Bonus" \
            --build-arg VITE_SENTRY_REPLAY_ENABLED="true" \
            --build-arg VITE_SENTRY_FEEDBACK_SCREENSHOT="false" \
            --build-arg VITE_APP_VERSION="tg-mini-frontend@$TAG" \
            --build-arg VITE_DEPLOYMENT_CHANNEL="beta" \
            --build-arg VITE_TEST="false" \
            --build-arg VITE_BOT_USERNAME="AIwithUIbot" \
            -t "$IMAGE:$TAG" \
            .
          docker push "$IMAGE:$TAG"
    repositories:
      - TelegramMiniAppProject_TgMiniFrontendNewUI_HttpsGithubComL1ghtnyTgMiniFrontendRefsHeadsMaster:
          path: frontend
          enabled: true

  deploy_beta:
    name: 3. Deploy Shared-History Beta
    runs-on: self-hosted
    dependencies:
      - build_backend
      - build_frontend
    steps:
      - type: script
        name: Deploy isolated beta workloads
        script-content: |-
          #!/bin/bash
          set -euo pipefail

          cd backend
          export K8S_TOOLS_DIR="$PWD/.teamcity-tools"
          export PATH="$K8S_TOOLS_DIR:$PATH"
          bash scripts/release/install_k8s_tools.sh

          export BACKEND_TAG="beta-%job.build_backend.build.number%"
          export FRONTEND_TAG="beta-%job.build_frontend.build.number%"
          bash scripts/release/deploy_beta.sh
        format-stderr-as-error: true
    repositories:
      - main:
          path: backend
          enabled: true
