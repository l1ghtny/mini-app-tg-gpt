server {
    listen 193.233.251.127:80;
    server_name app.lightny.ru;

    return 301 https://app.lightny.ru$request_uri;
}

server {
    listen 193.233.251.127:443 ssl http2;
    server_name app.lightny.ru;

    ssl_certificate /etc/letsencrypt/live/app.lightny.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.lightny.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    proxy_ssl_server_name on;
    # The same ingress IP serves multiple SNI certificates. Do not resume a
    # TLS session created for one upstream hostname in another location.
    proxy_ssl_session_reuse off;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    location = /_health/backend/live {
        proxy_pass https://10.77.0.1:30445/health/live;
        proxy_ssl_name gpt-mini-app-api.lightny.pro;
        proxy_set_header Host gpt-mini-app-api.lightny.pro;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /_health/backend/ready {
        proxy_pass https://10.77.0.1:30445/health/ready;
        proxy_ssl_name gpt-mini-app-api.lightny.pro;
        proxy_set_header Host gpt-mini-app-api.lightny.pro;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location ^~ /api/ {
        proxy_pass https://10.77.0.1:30445;
        proxy_ssl_name gpt-mini-app-api.lightny.pro;
        proxy_set_header Host gpt-mini-app-api.lightny.pro;

        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;

        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        add_header X-Accel-Buffering no always;
    }

    location ^~ /images/ {
        rewrite ^/images/(.*)$ /$1 break;

        proxy_pass https://10.77.0.1:8443;
        proxy_ssl_name tg-bot-images.lightny.pro;
        proxy_set_header Host tg-bot-images.lightny.pro;

        proxy_buffering on;
        proxy_request_buffering on;
        gzip off;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        expires 30d;
    }

    location / {
        proxy_pass https://10.77.0.1:30445;
        proxy_ssl_name gpt-mini-app.lightny.pro;
        proxy_set_header Host gpt-mini-app.lightny.pro;

        proxy_buffering off;
        gzip off;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
