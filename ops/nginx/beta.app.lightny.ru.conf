server {
    listen 193.233.251.127:80;
    server_name beta.app.lightny.ru;

    return 301 https://beta.app.lightny.ru$request_uri;
}

server {
    listen 193.233.251.127:443 ssl http2;
    server_name beta.app.lightny.ru;

    ssl_certificate /etc/letsencrypt/live/beta.app.lightny.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.app.lightny.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name beta.app.lightny.ru;
    proxy_ssl_session_reuse off;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    include /etc/nginx/snippets/lightny-proxy-headers.conf;
    proxy_set_header Host beta.app.lightny.ru;

    proxy_buffering off;
    proxy_request_buffering off;
    gzip off;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    add_header X-Accel-Buffering no always;

    location / {
        proxy_pass https://10.77.0.1:30445;
    }
}
