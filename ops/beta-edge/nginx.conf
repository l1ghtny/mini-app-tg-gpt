# Separate beta site; production upstreams and their guard remain independent.
upstream lightny_beta_frontend {
    server 10.78.0.5:30445;
    server 10.78.0.9:30445 backup;
}
upstream lightny_beta_backend {
    server 10.78.0.5:30445;
    server 10.78.0.9:30445 backup;
}
server {
    server_tokens off;
    listen 80;
    listen [::]:80;
    server_name beta.app.lightnyai.ru;
    access_log /var/log/nginx/lightnyai-beta-access.log lightny_edge;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}
server {
    server_tokens off;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name beta.app.lightnyai.ru;
    ssl_certificate /etc/letsencrypt/live/beta.app.lightnyai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.app.lightnyai.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/lightnyai-beta-access.log lightny_edge;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 520m;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_session_reuse off;
    proxy_ssl_name lightnyai-beta.internal;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_trusted_certificate /etc/nginx/trust/lightnyai-landing-ca.pem;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Robots-Tag;
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    location = /_health/edge {
        default_type text/plain;
        return 200 "beta-edge-ready\n";
    }
    location ~ ^/(?:_health/backend/|health/)(live|ready)$ {
        include /etc/nginx/snippets/lightnyai-proxy-headers.conf;
        proxy_set_header Host lightnyai-beta.internal;
        proxy_pass https://lightny_beta_backend/health/$1;
        proxy_read_timeout 10s;
    }
    location ^~ /api/ {
        include /etc/nginx/snippets/lightnyai-proxy-headers.conf;
        proxy_set_header Host lightnyai-beta.internal;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lightny_connection;
        proxy_pass https://lightny_beta_backend;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        # Never replay billable API writes through a backup.
        proxy_next_upstream off;
    }
    location ^~ /images/ {
        include /etc/nginx/snippets/lightnyai-proxy-headers.conf;
        proxy_set_header Host tg-bot-images.lightny.pro;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_ssl_name tg-bot-images.lightny.pro;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass https://lightny_images/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location / {
        include /etc/nginx/snippets/lightnyai-proxy-headers.conf;
        proxy_set_header Host lightnyai-beta.internal;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lightny_connection;
        proxy_pass https://lightny_beta_frontend;
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
