apiVersion: v1
kind: Pod
metadata:
  name: nginx-ingress-main-manual
  namespace: ingress
  labels:
    app: nginx-ingress-main-manual
    incident.codex/manual-ingress: "true"
spec:
  nodeName: main-server
  serviceAccountName: nginx-ingress-microk8s-serviceaccount
  dnsPolicy: ClusterFirst
  restartPolicy: Always
  terminationGracePeriodSeconds: 60
  containers:
    - name: nginx-ingress-microk8s
      image: registry.k8s.io/ingress-nginx/controller:v1.11.2
      imagePullPolicy: IfNotPresent
      args:
        - /nginx-ingress-controller
        - --configmap=$(POD_NAMESPACE)/nginx-load-balancer-microk8s-conf
        - --tcp-services-configmap=$(POD_NAMESPACE)/nginx-ingress-tcp-microk8s-conf
        - --udp-services-configmap=$(POD_NAMESPACE)/nginx-ingress-udp-microk8s-conf
        - --ingress-class=public
        - " "
        - --publish-status-address=127.0.0.1
        - --enable-ssl-passthrough
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      ports:
        - name: http
          containerPort: 80
          hostPort: 80
          protocol: TCP
        - name: https
          containerPort: 443
          hostPort: 443
          protocol: TCP
        - name: health
          containerPort: 10254
          hostPort: 10254
          protocol: TCP
      livenessProbe:
        httpGet:
          path: /healthz
          port: 10254
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /healthz
          port: 10254
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      securityContext:
        runAsUser: 101
        capabilities:
          add:
            - NET_BIND_SERVICE
          drop:
            - ALL
