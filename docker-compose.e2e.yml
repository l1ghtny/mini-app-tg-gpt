services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lightny_e2e
      POSTGRES_USER: lightny_e2e
      POSTGRES_PASSWORD: lightny_e2e
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightny_e2e -d lightny_e2e"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
